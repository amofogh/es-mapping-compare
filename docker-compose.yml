# Shared settings for one-shot jobs (same image for both steps)
x-app: &app
  build: .
  image: es-mapping-tools:latest
  pull_policy: build
  restart: "no"
  # Run as root so bind mounts are always writable; entrypoint chowns
  # outputs back to the host user when HOST_UID/HOST_GID are set:
  #   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up
  env_file:
    - .env
  environment:
    ES_VERIFY_CERTS: ${ES_VERIFY_CERTS:-false}
    # Optional: mic | mic,cd | mic-api,mic-ava  (empty = all)
    PREFIX_FILTER: ${PREFIX_FILTER:-}
    # Optional: pin index calendar day YYYY-MM-DD (panel / CLI)
    INDEX_DATE: ${INDEX_DATE:-}
    HOST_UID: ${HOST_UID:-}
    HOST_GID: ${HOST_GID:-}
  volumes:
    - ./results:/app/results
    - ./prefixes.json:/app/prefixes.json
    - ./.env:/app/.env:ro
  # Required on this host: bridge port-publish times out (firewall/FORWARD).
  # Host network lets Streamlit bind PANEL_PORT directly and reach ES.
  network_mode: host
  entrypoint: ["/docker-entrypoint.sh"]

services:
  # Step 1: scan Elasticsearch and merge service prefixes into prefixes.json
  discover-prefixes:
    <<: *app
    container_name: es-discover-prefixes
    command: ["discover"]

  # Step 2: mapping analysis only (after discover finishes successfully)
  es-mapping-compare:
    <<: *app
    container_name: es-mapping-compare
    command: ["compare"]
    depends_on:
      discover-prefixes:
        condition: service_completed_successfully

  # Streamlit dashboard — pick an index day and fetch from Elasticsearch
  panel:
    <<: *app
    container_name: efk-schema-panel
    restart: unless-stopped
    command: ["panel"]
    environment:
      PANEL_PORT: ${PANEL_PORT:-8080}
      STREAMLIT_SERVER_PORT: ${PANEL_PORT:-8080}
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_BROWSER_GATHERUSAGESTATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_CLIENT_TOOLBAR_MODE: "viewer"
      ES_VERIFY_CERTS: ${ES_VERIFY_CERTS:-false}
      PREFIX_FILTER: ${PREFIX_FILTER:-}
    volumes:
      - ./results:/app/results
      - ./prefixes.json:/app/prefixes.json:ro
      - ./.env:/app/.env:ro
      - ./app.py:/app/app.py:ro
      - ./compare_es_mappings.py:/app/compare_es_mappings.py:ro
      - ./.streamlit:/app/.streamlit:ro
