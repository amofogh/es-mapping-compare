[client]
# Hide developer menu (Clear cache / Rerun) so the "C" hotkey does not
# clear Streamlit cache — Ctrl+C / copy can work normally in the browser.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
