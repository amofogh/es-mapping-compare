[client]
# Hide developer menu (Clear cache / Rerun) so the "C" hotkey does not
# clear Streamlit cache — Ctrl+C / copy can work normally in the browser.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

# Dual themes so the in-app Light/Dark toggle can switch Streamlit natively
# (dataframes, selects, date inputs). Default selection is Dark.
[theme]
base = "dark"
font = "sans serif"

[theme.dark]
primaryColor = "#38bdf8"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"

[theme.light]
primaryColor = "#0068c9"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#31333F"
